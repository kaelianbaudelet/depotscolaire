name: CI/CD

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read
  packages: write
  deployments: write

jobs:
  tests:
    name: Tests & Quality
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: symfony
          MARIADB_USER: symfony
          MARIADB_PASSWORD: symfony
          MARIADB_ROOT_PASSWORD: symfony
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot --password=symfony"
          --health-interval=10s
          --health-timeout=5s
          --health-start-period=30s
          --health-retries=12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          extensions: intl, pdo_mysql, zip, opcache
          ini-values: memory_limit=512M

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: "--prefer-dist"

      - name: Cache warmup
        run: php bin/console cache:warmup --env=test
        env:
          APP_ENV: test
          DATABASE_URL: mysql://symfony:symfony@127.0.0.1:3306/symfony

      - name: Lint YAML & Twig
        run: |
          php bin/console lint:yaml config
          php bin/console lint:twig templates
        env:
          APP_ENV: test
          DATABASE_URL: mysql://symfony:symfony@127.0.0.1:3306/symfony

      - name: PHPUnit
        if: ${{ hashFiles('phpunit.xml*') != '' }}
        run: vendor/bin/phpunit --testdox
        env:
          APP_ENV: test
          DATABASE_URL: mysql://symfony:symfony@127.0.0.1:3306/symfony

  build_and_deploy:
    name: Build & Deploy to VPS
    runs-on: ubuntu-latest
    needs: tests
    if: github.ref == 'refs/heads/main'
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      IMAGE_TAG: ${{ github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_DNS_CONTENT: ${{ secrets.CLOUDFLARE_DNS_CONTENT }}
      CLOUDFLARE_PROXIED: ${{ secrets.CLOUDFLARE_PROXIED }}
      TRAEFIK_HOST: ${{ secrets.TRAEFIK_HOST }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      MAILER_DSN: ${{ secrets.MAILER_DSN }}
      MAILER_FROM_EMAIL: ${{ secrets.MAILER_FROM_EMAIL }}
      MAILER_FROM_NAME: ${{ secrets.MAILER_FROM_NAME }}
      PROD_DB_NAME: ${{ secrets.PROD_DB_NAME }}
      PROD_DB_USER: ${{ secrets.PROD_DB_USER }}
      PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
      PROD_DB_ROOT_PASSWORD: ${{ secrets.PROD_DB_ROOT_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH agent for remote Docker
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust VPS host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          endpoint: ssh://${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          cleanup: false
          install: true

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build & push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: symfony_prod
          push: true
          platforms: linux/arm64
          builder: ${{ steps.buildx.outputs.name }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Ensure Cloudflare DNS record
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ZONE_ID != '' && env.TRAEFIK_HOST != '' }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          dns_name="${TRAEFIK_HOST:-}"
          if [ -z "${dns_name}" ]; then
            echo "TRAEFIK_HOST secret is required to manage DNS records." >&2
            exit 1
          fi

          dns_content="${CLOUDFLARE_DNS_CONTENT:-$SSH_HOST}"
          if [ -z "${dns_content}" ]; then
            echo "Either CLOUDFLARE_DNS_CONTENT secret or SSH_HOST secret must be set to determine DNS record target." >&2
            exit 1
          fi

          proxied="${CLOUDFLARE_PROXIED:-false}"
          if [ "${proxied}" != "true" ]; then
            proxied=false
          fi

          echo "Ensuring A record ${dns_name} -> ${dns_content} (proxied: ${proxied})"

          existing=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/dns_records?type=A&name=${dns_name}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json")

          if [ "$(echo "${existing}" | jq -r '.success')" != "true" ]; then
            echo "Failed to query existing DNS records: ${existing}" >&2
            exit 1
          fi

          record_id=$(echo "${existing}" | jq -r '.result[0].id // empty')

          payload=$(jq -n --arg type "A" --arg name "${dns_name}" --arg content "${dns_content}" --argjson proxied "${proxied}" '{
            type: $type,
            name: $name,
            content: $content,
            ttl: 120,
            proxied: $proxied
          }')

          if [ -z "${record_id}" ]; then
            echo "Creating DNS record..."
            response=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/dns_records" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "${payload}")
          else
            echo "Updating DNS record ${record_id}..."
            response=$(curl -s -X PUT "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/dns_records/${record_id}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "${payload}")
          fi

          if [ "$(echo "${response}" | jq -r '.success')" != "true" ]; then
            echo "Failed to apply DNS record: ${response}" >&2
            exit 1
          fi

          echo "DNS record is up to date."

      - name: Render production environment files
        run: |
          set -euo pipefail

          required_vars=(PROD_DB_NAME PROD_DB_USER PROD_DB_PASSWORD PROD_DB_ROOT_PASSWORD APP_SECRET MAILER_DSN MAILER_FROM_EMAIL MAILER_FROM_NAME TRAEFIK_HOST)
          for var in "${required_vars[@]}"; do
            if [ -z "${!var:-}" ]; then
              echo "Missing environment variable: $var" >&2
              exit 1
            fi
          done

          envsubst < docker/env/prod.env.tpl > docker/env/prod.env
          envsubst < docker/env/prod-db.env.tpl > docker/env/prod-db.env

      - name: Copy deployment assets to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.prod.yml,docker/env/prod.env,docker/env/prod-db.env
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            docker login ${{ env.REGISTRY }} -u "${{ secrets.REGISTRY_USERNAME }}" -p "${{ secrets.REGISTRY_TOKEN }}"
            cd ${{ secrets.DEPLOY_PATH }}
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            IMAGE_NAME=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            IMAGE_TAG=${{ env.IMAGE_TAG }} \
            TRAEFIK_HOST=${{ secrets.TRAEFIK_HOST }} \
            TRAEFIK_NETWORK=${{ secrets.TRAEFIK_NETWORK }} \
            TRAEFIK_ROUTER=${{ secrets.TRAEFIK_ROUTER }} \
            TRAEFIK_ENTRYPOINTS=${{ secrets.TRAEFIK_ENTRYPOINTS }} \
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
