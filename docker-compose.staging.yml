services:
  app:
    build:
      context: .
      target: symfony_prod
    image: ${STAGING_IMAGE_NAME:-symfony-app:staging}
    container_name: ${COMPOSE_PROJECT_NAME:-symfony-staging}_app
    environment:
      APP_ENV: staging
      APP_DEBUG: 0
      APP_SECRET: ${APP_SECRET:-change-me}
      DATABASE_URL: mysql://symfony:symfony@db:3306/symfony?serverVersion=10.11.6-MariaDB
      MAILER_DSN: smtp://mailpit:1025
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8082:80"

  db:
    image: mariadb:10.11
    container_name: ${COMPOSE_PROJECT_NAME:-symfony-staging}_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: symfony
      MARIADB_USER: symfony
      MARIADB_PASSWORD: symfony
      MARIADB_ROOT_PASSWORD: rootpass
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - staging_db_data:/var/lib/mysql

  mailpit:
    image: axllent/mailpit:latest
    container_name: ${COMPOSE_PROJECT_NAME:-symfony-staging}_mailpit
    restart: unless-stopped
    ports:
      - "1825:1025"
      - "8125:8025"

volumes:
  staging_db_data:
