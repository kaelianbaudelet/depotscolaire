services:
  app:
    build:
      context: .
      target: symfony_prod
    container_name: ${COMPOSE_PROJECT_NAME:-symfony}_app_prod
    hostname: app
    restart: always
    ports:
      - "8861:80"
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      APP_SECRET: ${APP_SECRET:-change_this_in_production}
      DATABASE_URL: mysql://symfony:${MARIADB_PASSWORD:-symfony}@db:3306/symfony?serverVersion=11.4.2-MariaDB&charset=utf8mb4
      MAILER_DSN: smtp://mailpit:1025
    volumes:
      - ./:/var/www/html:delegated
      - symfony_var:/var/www/html/var
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  db:
    image: mariadb:latest
    container_name: ${COMPOSE_PROJECT_NAME:-symfony}_db_prod
    hostname: db
    restart: always
    environment:
      MARIADB_DATABASE: symfony
      MARIADB_USER: symfony
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-symfony}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootpass}
    healthcheck:
      test:
        [
          "CMD",
          "mariadb-admin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p${MARIADB_ROOT_PASSWORD:-rootpass}",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "8862:3306"
    volumes:
      - db_data:/var/lib/mysql

  dbgate:
    image: dbgate/dbgate:latest
    container_name: ${COMPOSE_PROJECT_NAME:-symfony}_dbgate_prod
    hostname: dbgate
    restart: always
    depends_on:
      - db
    ports:
      - "8863:3000"
    environment:
      - LOGIN=${DBGATE_LOGIN:-admin}
      - PASSWORD=${DBGATE_PASSWORD:-admin_password}

  mailpit:
    image: axllent/mailpit:latest
    container_name: ${COMPOSE_PROJECT_NAME:-symfony}_mailpit_prod
    hostname: mailpit
    restart: always
    ports:
      - "8864:8025"
      - "1025:1025"
    environment:
      - MP_UI_AUTH=${MAILPIT_AUTH:-admin:password}

volumes:
  db_data:
  symfony_var:
