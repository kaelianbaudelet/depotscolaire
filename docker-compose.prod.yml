services:
  app:
    image: ${IMAGE_NAME:-ghcr.io/example/symfony-app}:${IMAGE_TAG:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-symfony}_app
    restart: unless-stopped
    env_file:
      - docker/env/prod.env
    environment:
      APP_ENV: prod
      APP_DEBUG: 1
    depends_on:
      db:
        condition: service_healthy
    networks:
      - traefik
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-symfony}.rule=Host(`${TRAEFIK_HOST}`)"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-symfony}.entrypoints=${TRAEFIK_ENTRYPOINTS:-websecure}"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-symfony}.tls=true"
      - "traefik.http.services.${TRAEFIK_ROUTER:-symfony}.loadbalancer.server.port=80"

  db:
    image: mariadb:10.11
    container_name: ${COMPOSE_PROJECT_NAME:-symfony}_db
    restart: unless-stopped
    env_file:
      - docker/env/prod-db.env
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
