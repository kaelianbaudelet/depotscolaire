services:
  app:
    build:
      context: .
      target: symfony_dev
    container_name: ${COMPOSE_PROJECT_NAME:-symfony}_app
    hostname: app
    ports:
      - "8080:80"
    environment:
      APP_ENV: dev
      APP_DEBUG: 1
      APP_SECRET: dev-secret
      DATABASE_URL: mysql://symfony:symfony@db:3306/symfony?serverVersion=11.4.2-MariaDB&charset=utf8mb4
      MAILER_DSN: smtp://mailpit:1025
    volumes:
      - ./:/var/www/html:delegated
      - symfony_var:/var/www/html/var
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  db:
    image: mariadb:latest
    container_name: ${COMPOSE_PROJECT_NAME:-symfony}_db
    hostname: db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: symfony
      MARIADB_USER: symfony
      MARIADB_PASSWORD: symfony
      MARIADB_ROOT_PASSWORD: rootpass
    healthcheck:
      test:
        [
          "CMD",
          "mariadb-admin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-prootpass",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  dbgate:
    image: dbgate/dbgate:latest
    container_name: ${COMPOSE_PROJECT_NAME:-symfony}_dbgate
    hostname: dbgate
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8081:3000"

  mailpit:
    image: axllent/mailpit:latest
    container_name: ${COMPOSE_PROJECT_NAME:-symfony}_mailpit
    hostname: mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  db_data:
  symfony_var:
